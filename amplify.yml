# AWS Amplify Hosting build spec for the Next.js app in web/ (WEB_COMPUTE platform).
# Monorepo format: applications[].appRoot must equal the AMPLIFY_MONOREPO_APP_ROOT env var (web).
# buildPath "/" runs every command from the repository root so the hoisted pnpm install lands in
# the root node_modules that Amplify packages with the app. See web/README-amplify.md.
version: 1
applications:
  - appRoot: web
    buildPath: /
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 24
            - nvm use 24
            - node --version
            - corepack enable
            - corepack prepare pnpm@12.18.0 --activate
            - pnpm --version
            # Amplify needs a flat node_modules. pnpm 12 reads the linker setting from
            # pnpm-workspace.yaml (nodeLinker), not .npmrc; appended for this build only (not committed).
            - cd "$(git rev-parse --show-toplevel)" && pwd && printf '\nnodeLinker%s hoisted\n' ':' >> pnpm-workspace.yaml && pnpm install --frozen-lockfile --filter "web..." --filter "db..." && ls node_modules/next/package.json
        build:
          commands:
            # SSR runtime only sees variables written to .env.production at build time.
            - cd "$(git rev-parse --show-toplevel)/web" && pwd && env | grep -E '^(LIVEKIT_|DATABASE_URL|AGENT_NAME|ALLOW_TOKEN_ROUTE|DEMO_|LK_|CONSOLE_PASSWORD|FEATURE_|NEXT_PUBLIC_)' >> .env.production && pnpm build
            # Amplify packages web/node_modules at deploy time; the hoisted install lives at the root, so copy it in.
            - cd "$(git rev-parse --show-toplevel)" && rm -rf web/node_modules && cp -a node_modules web/node_modules && rm -rf web/node_modules/db && cp -a db web/node_modules/db && ls web/node_modules/next/package.json
      artifacts:
        # Resolved relative to appRoot even with buildPath set.
        baseDirectory: .next
        files:
          - '**/*'
