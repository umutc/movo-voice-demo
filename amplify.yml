# AWS Amplify Hosting build spec for the Next.js app in web/ (WEB_COMPUTE platform).
# Monorepo format: applications[].appRoot must equal the AMPLIFY_MONOREPO_APP_ROOT env var (web).
# buildPath "/" runs every command from the repository root so the hoisted pnpm install lands in
# the root node_modules that Amplify packages with the app. See web/README-amplify.md.
version: 1
applications:
  - appRoot: web
    buildPath: /
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 24
            - nvm use 24
            - node --version
            - corepack enable
            - corepack prepare pnpm@12.18.0 --activate
            - pnpm --version
            # Amplify docs require node-linker=hoisted for pnpm workspaces; passed on the command line.
            - cd "$(git rev-parse --show-toplevel)" && pwd && pnpm install --frozen-lockfile --config.node-linker=hoisted --filter "web..." --filter "db..."
        build:
          commands:
            # SSR runtime only sees variables written to .env.production at build time.
            - cd "$(git rev-parse --show-toplevel)/web" && pwd && env | grep -E '^(LIVEKIT_|DATABASE_URL|AGENT_NAME|ALLOW_TOKEN_ROUTE|DEMO_|LK_|NEXT_PUBLIC_)' >> .env.production && pnpm build
      artifacts:
        # buildPath / is the parent of the checkout (CODEBUILD_SRC_DIR); the repo sits in movo-voice-demo/.
        baseDirectory: movo-voice-demo/web/.next
        files:
          - '**/*'
      cache:
        paths:
          - movo-voice-demo/web/.next/cache/**/*
