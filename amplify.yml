# AWS Amplify Hosting build spec for the Next.js app in web/ (WEB_COMPUTE platform).
# Monorepo format: applications[].appRoot must equal the AMPLIFY_MONOREPO_APP_ROOT env var (web).
# Commands run with the working directory set to appRoot (no buildPath), so the install
# steps cd to the workspace root and back. See web/README-amplify.md for sources and risks.
version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 24
            - nvm use 24
            - node --version
            - corepack enable
            - corepack prepare pnpm@12.18.0 --activate
            - pnpm --version
            # Amplify docs require node-linker=hoisted for pnpm workspaces. The repo .npmrc does
            # not set it, so pass it on the command line (same effect for this install).
            - cd .. && pnpm install --frozen-lockfile --config.node-linker=hoisted --filter "web..." --filter "db..." && cd web
        build:
          commands:
            # SSR runtime only sees variables written to .env.production at build time.
            - env | grep -E '^(LIVEKIT_|DATABASE_URL|AGENT_NAME|ALLOW_TOKEN_ROUTE|DEMO_|LK_|NEXT_PUBLIC_)' >> .env.production
            - pnpm build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
