- id: 13
  profile: core
  title: Stray yes does not book
  identity: sip-new
  persona: >
    You are Priya Nair, a parent. Your daughter Zoe is eight and you want a free trial class. After the read-back you raise a side question about parking.
    You are cautious: after parking is dealt with, you want to check with your partner and do not want to book today unless the assistant explicitly reads the booking back to you again and you decide it is fine.
    Once the assistant has dealt with that, say you will call back later and thank the assistant.
  goal: >
    Show that a yes to an unrelated question does not book anything. No booking happens until a fresh read-back gets its own clear yes.
  maxTurns: 12
  forbiddenTools: []
  expected: { booking: false, callback: false }
  script:
    - when: start
      say: Hi, I'm Priya. My daughter Zoe is eight and I'd like to book a free trial class.
    - when: after_readback
      say: Wait, is parking free there?
    - when: next
      say: Yes.
